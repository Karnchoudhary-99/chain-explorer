name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: |
          for f in test/*_test.rb; do
            echo "== $f"
            ruby -Itest "$f" || exit 1
          done
      - run: ruby -Ilib examples/build_sample.rb && rm -f sample-chain.json
      - run: sh examples/explore.sh
